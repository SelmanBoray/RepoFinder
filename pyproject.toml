[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofinder"
version = "0.1.0"
description = "Explore a GitHub repository: architecture map and 'where is feature X implemented' answers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    # Upper bounds: extractors depend on grammar node names, which can change between minor versions; these are the tested versions. tree-sitter>=0.25 is required because the JS/Go/Rust grammars are ABI 15 and the code uses QueryCursor.
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-java>=0.23,<0.24",
    "anthropic>=1.12",
    "typer>=0.12",
    "rich>=13.7",
    "typesafe-sdk>=0.7,<1",
]

[project.scripts]
repofinder = "repofinder.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
# Dart is optional: the grammar revision is tied to the exact package version
dart = ["tree-sitter-language-pack==1.23.1"]
# kept for compatibility; typesafe-sdk is now a core dependency
jev = []

[tool.setuptools]
packages = ["repofinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: parses a large real repository (skipped when its checkout is missing)",
]
