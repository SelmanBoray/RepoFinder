[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofinder"
version = "0.1.0"
description = "Explore a GitHub repository: architecture map and 'where is feature X implemented' answers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "anthropic>=1.12",
    "typer>=0.12",
    "rich>=13.7",
    "typesafe-sdk>=0.7,<1",
]

[project.scripts]
repofinder = "repofinder.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
# kept for compatibility; typesafe-sdk is now a core dependency
jev = []

[tool.setuptools]
packages = ["repofinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: parses a large real repository (skipped when its checkout is missing)",
]
